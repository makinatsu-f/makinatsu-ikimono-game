<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マキナツ いきものゲーム室</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "DotGothic16", sans-serif;
    }

    .game-screen {
      width: 480px;
      min-height: 640px;
      background: #b9dce5;
      text-align: center;
      box-sizing: border-box;
      padding: 40px 20px;
    }

    .brand {
      font-size: 22px;
      color: #3b1787;
      margin-bottom: 10px;
    }

    .title {
      font-size: 38px;
      font-weight: bold;
      color: #3b1787;
      margin-bottom: 80px;
    }

    .menu-button {
      display: inline-block;
      padding: 14px 55px;
      background: #6d9841;
      color: white;
      font-size: 30px;
      border: 5px solid #3d4140;
      border-radius: 15px;
      box-shadow: 5px 5px 0 #333;
      cursor: pointer;
    }

    .menu-button:active {
      transform: translate(4px, 4px);
      box-shadow: 1px 1px 0 #333;
    }
  </style>
</head>

<body>

  <div class="game-screen">

    <div class="brand">マキナツ</div>

    <div class="title">
      いきものゲーム室
    </div>

    <a href="menu.html" class="menu-button">
      MENU
    </a>

  </div>

</body>
</html>
